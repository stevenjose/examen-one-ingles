<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">English Quest v2.11 - Examen 28 Octubre</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #ec4899;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --bg-gradient: linear-gradient(
          135deg,
          #1e1b4b 0%,
          #312e81 50%,
          #1e1b4b 100%
        );
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Fredoka", sans-serif;
        background: var(--bg-gradient);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        overflow-x: hidden;
      }

      .game-wrapper {
        width: 100%;
        max-width: 650px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        position: relative;
      }

      /* --- SELECTOR DE MÓDULOS / TEMAS --- */
      .module-selector {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 10px;
        margin-bottom: 12px;
        scrollbar-width: thin;
      }

      .mod-btn {
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid transparent;
        color: #cbd5e1;
        padding: 8px 12px;
        border-radius: 14px;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
      }

      .mod-btn.active {
        background: var(--primary);
        color: white;
        border-color: #a5b4fc;
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
      }

      /* --- BARRA SUPERIOR Y BADGE DE VERSIÓN --- */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge {
        background: rgba(255, 255, 255, 0.15);
        padding: 5px 12px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .version-badge {
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(14, 165, 233, 0.4);
        transition: transform 0.2s;
      }

      .version-badge:hover {
        transform: scale(1.05);
      }

      .progress-container {
        width: 100%;
        height: 12px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00f3ff, #22c55e);
        transition: width 0.4s ease;
      }

      /* ==========================================
           MUÑECO 3D INTERACTIVO (ROBO-TEACHER)
           ========================================== */
      .mascot-stage {
        perspective: 800px;
        height: 125px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 8px;
      }

      .robot-3d {
        width: 100px;
        height: 95px;
        position: relative;
        transform-style: preserve-3d;
        animation: float3d 3s ease-in-out infinite;
        cursor: pointer;
      }

      @keyframes float3d {
        0%,
        100% {
          transform: translateY(0px) rotateX(5deg) rotateY(-8deg);
        }
        50% {
          transform: translateY(-10px) rotateX(-5deg) rotateY(8deg);
        }
      }

      .robot-head {
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, #60a5fa, #3b82f6);
        border-radius: 24px;
        border: 3px solid #93c5fd;
        box-shadow:
          0 8px 0 #1d4ed8,
          0 15px 20px rgba(0, 0, 0, 0.4),
          inset 0 4px 10px rgba(255, 255, 255, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.3s ease;
      }

      .robot-antenna {
        position: absolute;
        top: -18px;
        width: 6px;
        height: 16px;
        background: #94a3b8;
      }
      .robot-antenna::after {
        content: "";
        position: absolute;
        top: -10px;
        left: -5px;
        width: 16px;
        height: 16px;
        background: radial-gradient(circle at 30% 30%, #f43f5e, #be123c);
        border-radius: 50%;
        box-shadow: 0 0 12px #f43f5e;
        animation: pulseGlow 1.5s infinite alternate;
      }

      @keyframes pulseGlow {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.2);
          box-shadow: 0 0 18px #ff0055;
        }
      }

      .robot-ear {
        position: absolute;
        top: 30px;
        width: 10px;
        height: 26px;
        background: #1d4ed8;
        border-radius: 5px;
      }
      .robot-ear.left {
        left: -10px;
      }
      .robot-ear.right {
        right: -10px;
      }

      .robot-screen {
        width: 82%;
        height: 68%;
        background: #0f172a;
        border-radius: 14px;
        border: 2px solid #1e293b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .eyes-row {
        display: flex;
        gap: 16px;
      }
      .eye {
        width: 14px;
        height: 18px;
        background: #00f3ff;
        border-radius: 50%;
        box-shadow: 0 0 8px #00f3ff;
        animation: blinkEye 4s infinite;
      }
      @keyframes blinkEye {
        0%,
        94%,
        98% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }

      .mouth {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 12px;
      }
      .mouth-bar {
        width: 4px;
        height: 4px;
        background: #00f3ff;
        border-radius: 2px;
      }

      .robot-3d.speaking .mouth-bar:nth-child(1) {
        animation: talk 0.25s infinite alternate;
      }
      .robot-3d.speaking .mouth-bar:nth-child(2) {
        animation: talk 0.2s infinite alternate 0.05s;
      }
      .robot-3d.speaking .mouth-bar:nth-child(3) {
        animation: talk 0.3s infinite alternate 0.1s;
      }
      .robot-3d.speaking .mouth-bar:nth-child(4) {
        animation: talk 0.2s infinite alternate 0.15s;
      }
      .robot-3d.speaking .mouth-bar:nth-child(5) {
        animation: talk 0.25s infinite alternate 0.05s;
      }

      @keyframes talk {
        0% {
          height: 4px;
        }
        100% {
          height: 14px;
          background: #38bdf8;
        }
      }

      .robot-3d.happy .robot-head {
        background: linear-gradient(145deg, #4ade80, #16a34a);
        border-color: #bbf7d0;
        box-shadow: 0 8px 0 #15803d;
      }
      .robot-3d.thinking .robot-head {
        background: linear-gradient(145deg, #fbbf24, #d97706);
        border-color: #fde68a;
        box-shadow: 0 8px 0 #b45309;
      }
      .robot-3d.oops .robot-head {
        background: linear-gradient(145deg, #f87171, #dc2626);
        border-color: #fecaca;
        box-shadow: 0 8px 0 #991b1b;
      }

      /* --- BOCADILLO DE AYUDA --- */
      .help-bubble {
        background: #ffffff;
        color: #1e293b;
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 14px;
        border: 3px solid var(--warning);
        display: none;
      }

      .help-title {
        font-weight: 700;
        color: #d97706;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.95rem;
      }

      .help-text {
        font-size: 0.95rem;
        line-height: 1.4;
        margin-bottom: 8px;
      }
      .help-example {
        background: #fef3c7;
        border-left: 4px solid #f59e0b;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 0.88rem;
        color: #92400e;
        margin-bottom: 10px;
      }

      /* --- TARJETA DE PREGUNTA --- */
      .question-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 16px;
        text-align: center;
      }

      .category-tag {
        display: inline-block;
        background: var(--secondary);
        color: white;
        font-size: 0.78rem;
        padding: 4px 12px;
        border-radius: 15px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .emoji-visual {
        font-size: 2.8rem;
        margin: 4px 0;
      }
      .question-text {
        font-size: 1.25rem;
        margin-bottom: 12px;
        line-height: 1.3;
      }

      .quick-chips {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .chip-btn {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        padding: 6px 12px;
        border-radius: 20px;
        font-family: "Fredoka", sans-serif;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .chip-btn:hover {
        background: var(--primary);
        border-color: #fff;
      }

      .audio-controls {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .btn-tool {
        border: none;
        padding: 8px 12px;
        border-radius: 12px;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        color: white;
      }

      .btn-listen {
        background: #0ea5e9;
        box-shadow: 0 3px 0 #0284c7;
      }
      .btn-slow {
        background: #8b5cf6;
        box-shadow: 0 3px 0 #6d28d9;
      }
      .btn-help {
        background: #f59e0b;
        box-shadow: 0 3px 0 #d97706;
      }
      .btn-letter {
        background: #10b981;
        box-shadow: 0 3px 0 #059669;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .answer-input {
        width: 100%;
        padding: 12px;
        font-size: 1.25rem;
        font-family: "Fredoka", sans-serif;
        text-align: center;
        border-radius: 14px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        background: rgba(15, 23, 42, 0.85);
        color: #fff;
        outline: none;
      }
      .answer-input:focus {
        border-color: #00f3ff;
      }

      .btn-row {
        display: flex;
        gap: 8px;
      }

      .btn-submit {
        flex: 2;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        border: none;
        padding: 13px;
        border-radius: 14px;
        font-size: 1.1rem;
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 0 #15803d;
      }

      .btn-skip {
        flex: 1;
        background: rgba(255, 255, 255, 0.15);
        color: #e2e8f0;
        border: none;
        padding: 13px;
        border-radius: 14px;
        font-size: 0.95rem;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        cursor: pointer;
      }

      .feedback-msg {
        margin-top: 10px;
        font-size: 1.05rem;
        font-weight: 600;
        min-height: 26px;
      }

      .version-footer {
        margin-top: 14px;
        text-align: center;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="game-wrapper">
      <!-- Selector de Categorías (Activo en todo momento, incluso al terminar un módulo) -->
      <div class="module-selector">
        <button class="mod-btn active" onclick="filterCategory('ALL', this)">
          🌟 Todo (52)
        </button>
        <button class="mod-btn" onclick="filterCategory('DAYS', this)">
          📅 Días (7)
        </button>
        <button class="mod-btn" onclick="filterCategory('NUMBERS', this)">
          🔢 Números 1-20 (20)
        </button>
        <button class="mod-btn" onclick="filterCategory('ANIMALS', this)">
          🦁 Animales y Partes (13)
        </button>
        <button class="mod-btn" onclick="filterCategory('GRAMMAR', this)">
          💬 It is / Has got / Can (12)
        </button>
      </div>

      <div class="top-bar">
        <div class="badge">⭐ Puntos: <span id="score">0</span></div>
        <div
          class="version-badge"
          onclick="announceVersion()"
          title="Toca para comprobar versión"
        >
          🚀 <span id="version-badge-text">v2.11</span>
        </div>
        <div class="badge">
          📝 <span id="current-q">1</span> / <span id="total-q">52</span>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <!-- MUÑECO 3D -->
      <div class="mascot-stage">
        <div class="robot-3d" id="robo-teacher" onclick="robotSalute()">
          <div class="robot-antenna"></div>
          <div class="robot-ear left"></div>
          <div class="robot-ear right"></div>
          <div class="robot-head">
            <div class="robot-screen">
              <div class="eyes-row">
                <div class="eye"></div>
                <div class="eye"></div>
              </div>
              <div class="mouth">
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
                <div class="mouth-bar"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- BOCADILLO DE AYUDA -->
      <div class="help-bubble" id="help-bubble">
        <div class="help-title">
          <span>🤖 Explicación del Robot:</span>
          <button class="btn-tool btn-letter" onclick="repeatHintVoice()">
            🔊 Escuchar pista
          </button>
        </div>
        <p class="help-text" id="help-explanation"></p>
        <div class="help-example" id="help-example"></div>
        <button class="btn-tool btn-letter" onclick="revealNextLetter()">
          🔍 Dame una letra (<span id="letters-left"></span>)
        </button>
      </div>

      <!-- TARJETA DE PREGUNTA -->
      <div class="question-card" id="quiz-box">
        <span class="category-tag" id="q-category">Categoría</span>
        <div class="emoji-visual" id="q-emoji">📅</div>
        <h2 class="question-text" id="q-text">Pregunta</h2>

        <div class="quick-chips" id="quick-chips"></div>

        <div class="audio-controls">
          <button class="btn-tool btn-listen" onclick="speakEnglishWord(0.9)">
            🇬🇧 Escuchar Inglés
          </button>
          <button class="btn-tool btn-slow" onclick="speakEnglishWord(0.45)">
            🐢 Modo Tortuga
          </button>
          <button class="btn-tool btn-help" onclick="toggleHelp()">
            💡 ¡Explicación y Pista!
          </button>
        </div>

        <div class="input-group">
          <input
            type="text"
            id="user-input"
            class="answer-input"
            placeholder="Escribe tu respuesta aquí..."
            autocomplete="off"
            spellcheck="false"
          />
          <div class="btn-row">
            <button class="btn-submit" onclick="checkAnswer()">
              ✅ Comprobar
            </button>
            <button class="btn-skip" onclick="skipQuestion()">⏭️ Saltar</button>
          </div>
        </div>

        <div class="feedback-msg" id="feedback"></div>
      </div>

      <div class="version-footer">
        <span
          >🤖 English Quest —
          <strong
            >Versión <span id="version-footer-text">2.11</span></strong
          ></span
        >
        <span>•</span>
        <span>Repaso Examen 28 Oct</span>
      </div>
    </div>

    <script>
      // =====================================================
      // CONTROL DE VERSIÓN (v2.11)
      // =====================================================
      const APP_VERSION = "2.11";

      document.getElementById("version-badge-text").textContent =
        `v${APP_VERSION}`;
      document.getElementById("version-footer-text").textContent = APP_VERSION;
      document.getElementById("page-title").textContent =
        `English Quest v${APP_VERSION} - Examen 28 Octubre`;

      function announceVersion() {
        robotSpeak(
          `Estás jugando en la versión ${APP_VERSION}. ¡Ahora puedes cambiar de tema arriba en cualquier momento!`,
          "es-ES",
          1.05,
        );
      }

      // =====================================================
      // BANCO COMPLETO DE 52 PREGUNTAS
      // =====================================================
      const allQuestions = [
        // --- 1. LOS 7 DÍAS DE LA SEMANA ---
        {
          mod: "DAYS",
          category: "Days of the Week (1/7)",
          emoji: "🌙",
          question: "¿Cómo se escribe LUNES en inglés?",
          answer: "monday",
          hint: "Empieza con M-O-N (como Moon, luna) y termina en D-A-Y.",
          example:
            "Ejemplo: 'Monday is the first day of school' (El lunes es el primer día de cole).",
        },
        {
          mod: "DAYS",
          category: "Days of the Week (2/7)",
          emoji: "🦖",
          question: "¿Cómo se escribe MARTES en inglés?",
          answer: "tuesday",
          hint: "Empieza por T-U-E-S y termina en D-A-Y. ¡No lo confundas con el jueves!",
          example:
            "Ejemplo: 'On Tuesday I play with my friends' (El martes juego con mis amigos).",
        },
        {
          mod: "DAYS",
          category: "Days of the Week (3/7)",
          emoji: "🐪",
          question: "¿Cómo se escribe MIÉRCOLES en inglés?",
          answer: "wednesday",
          hint: "¡Palabra tramposa! Lleva una 'D' muda que no suena: W-E-D-N-E-S-D-A-Y.",
          example:
            "Ejemplo: 'Wednesday is in the middle of the week' (El miércoles está en mitad de la semana).",
        },
        {
          mod: "DAYS",
          category: "Days of the Week (4/7)",
          emoji: "⚡",
          question: "¿Cómo se escribe JUEVES en inglés?",
          answer: "thursday",
          hint: "Empieza con T-H-U-R (como el dios Thor) y termina en S-D-A-Y.",
          example:
            "Ejemplo: 'Thursday comes after Wednesday' (El jueves va después del miércoles).",
        },
        {
          mod: "DAYS",
          category: "Days of the Week (5/7)",
          emoji: "🎉",
          question: "¿Cómo se escribe VIERNES en inglés?",
          answer: "friday",
          hint: "Es muy fácil: empieza con F-R-I y termina en D-A-Y.",
          example: "Ejemplo: 'I love Friday!' (¡Me encanta el viernes!).",
        },
        {
          mod: "DAYS",
          category: "Days of the Week (6/7)",
          emoji: "🪐",
          question: "¿Cómo se escribe SÁBADO en inglés?",
          answer: "saturday",
          hint: "Viene de Saturno: empieza con S-A-T-U-R y termina en D-A-Y.",
          example:
            "Ejemplo: 'No school on Saturday!' (¡No hay cole el sábado!).",
        },
        {
          mod: "DAYS",
          category: "Days of the Week (7/7)",
          emoji: "☀️",
          question: "¿Cómo se escribe DOMINGO en inglés?",
          answer: "sunday",
          hint: "Es el día del Sol (Sun): se escribe S-U-N-D-A-Y.",
          example:
            "Ejemplo: 'Sunday is a family day' (El domingo es día de familia).",
        },

        // --- 2. NÚMEROS DEL 1 AL 20 ---
        {
          mod: "NUMBERS",
          category: "Numbers 1-20",
          emoji: "1️⃣",
          question: "Escribe con letras el número 1:",
          answer: "one",
          hint: "Aunque suena 'uan', se escribe con O: O-N-E.",
          example: "Ejemplo: 'I have got one nose' (Tengo una nariz).",
        },
        {
          mod: "NUMBERS",
          category: "Numbers 1-20",
          emoji: "2️⃣",
          question: "Escribe con letras el número 2:",
          answer: "two",
          hint: "Tiene una W en medio que no suena: T-W-O.",
          example: "Ejemplo: 'Two eyes and two ears' (Dos ojos y dos orejas).",
        },
        {
          mod: "NUMBERS",
          category: "Numbers 1-20",
          emoji: "3️⃣",
          question: "Escribe con letras el número 3:",
          answer: "three",
          hint: "Empieza con T-H-R y termina con dos letras E: E-E.",
          example: "Ejemplo: 'One, two, three, go!' (¡Uno, dos, tres, ya!).",
        },
        {
          mod: "NUMBERS",
          category: "Numbers 1-20",
          emoji: "4️⃣",
          question: "Escribe con letras el número 4:",
          answer: "four",
          hint: "Lleva una O y una U en medio: F-O-U-R.",
          example:
            "Ejemplo: 'A dog has got four legs' (Un perro tiene cuatro patas).",
        },
        {
          mod: "NUMBERS",
          category: "Numbers 1-20",
          emoji: "5️⃣",
          question: "Escribe con letras el número 5:",
          answer: "five",
          hint: "Se escribe con V y termina en E muda: F-I-V-E.",
          example: "Ejemplo: 'High five!' (¡Choca esos cinco!).",
        },
        {
          mod: "NUMBERS",
          category: "Numbers 1-20",
          emoji: "6️⃣",

      let activeQuestions = [...allQuestions];
      let currentIndex = 0;
      let score = 0;
      let revealedLetters = 0;
      let currentModuleKey = "ALL";
      const robot = document.getElementById("robo-teacher");
      const inputField = document.getElementById("user-input");

      inputField.addEventListener("keypress", function (e) {
        if (e.key === "Enter") checkAnswer();
      });

      // =====================================================
      // RESTAURAR LA TARJETA DE PREGUNTA SI ESTABA EN VICTORIA
      // =====================================================
      function ensureQuizBoxHTML() {
        const quizBox = document.getElementById("quiz-box");
        // Si la tarjeta muestra la pantalla de victoria, la reconstruimos con los controles normales
        if (!document.getElementById("user-input")) {
          quizBox.innerHTML = `
                    <span class="category-tag" id="q-category">Categoría</span>
                    <div class="emoji-visual" id="q-emoji">📅</div>
                    <h2 class="question-text" id="q-text">Pregunta</h2>

                    <div class="quick-chips" id="quick-chips"></div>

                    <div class="audio-controls">
                        <button class="btn-tool btn-listen" onclick="speakEnglishWord(0.9)">🇬🇧 Escuchar Inglés</button>
                        <button class="btn-tool btn-slow" onclick="speakEnglishWord(0.45)">🐢 Modo Tortuga</button>
                        <button class="btn-tool btn-help" onclick="toggleHelp()">💡 ¡Explicación y Pista!</button>
                    </div>

                    <div class="input-group">
                        <input type="text" id="user-input" class="answer-input" placeholder="Escribe tu respuesta aquí..." autocomplete="off" spellcheck="false">
                        <div class="btn-row">
                            <button class="btn-submit" onclick="checkAnswer()">✅ Comprobar</button>
                            <button class="btn-skip" onclick="skipQuestion()">⏭️ Saltar</button>
                        </div>
                    </div>

                    <div class="feedback-msg" id="feedback"></div>
                `;
          // Volver a enlazar el evento Enter del input recién creado
          document
            .getElementById("user-input")
            .addEventListener("keypress", function (e) {
              if (e.key === "Enter") checkAnswer();
            });
        }
      }

      function filterCategory(modName, btnElement) {
        document
          .querySelectorAll(".mod-btn")
          .forEach((b) => b.classList.remove("active"));
        btnElement.classList.add("active");

        currentModuleKey = modName;
        if (modName === "ALL") {
          activeQuestions = [...allQuestions];
        } else {
          activeQuestions = allQuestions.filter((q) => q.mod === modName);
        }
        currentIndex = 0;
        ensureQuizBoxHTML();
        loadQuestion();
      }

      function robotSpeak(text, lang = "es-ES", rate = 1.0) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = rate;
        utterance.pitch = lang.startsWith("es") ? 1.15 : 1.05;

        utterance.onstart = () => robot.classList.add("speaking");
        utterance.onend = () => robot.classList.remove("speaking");
        utterance.onerror = () => robot.classList.remove("speaking");

        window.speechSynthesis.speak(utterance);
      }

      function speakEnglishWord(speedRate) {
        if (
          activeQuestions.length === 0 ||
          currentIndex >= activeQuestions.length
        )
          return;
        const word = activeQuestions[currentIndex].answer;
        robotSpeak(word, "en-GB", speedRate);
      }

      function robotSalute() {
        robotSpeak(
          `¡Hola! Versión ${APP_VERSION}. Recuerda que puedes pulsar cualquier botón superior para cambiar de tema cuando quieras.`,
          "es-ES",
          1.05,
        );
      }

      function loadQuestion() {
        ensureQuizBoxHTML();
        if (currentIndex >= activeQuestions.length) {
          showVictory();
          return;
        }

        const q = activeQuestions[currentIndex];
        revealedLetters = 0;

        document.getElementById("current-q").textContent = currentIndex + 1;
        document.getElementById("total-q").textContent = activeQuestions.length;
        document.getElementById("q-category").textContent = q.category;
        document.getElementById("q-emoji").textContent = q.emoji;
        document.getElementById("q-text").textContent = q.question;
        document.getElementById("feedback").textContent = "";

        const freshInput = document.getElementById("user-input");
        if (freshInput) {
          freshInput.value = "";
          freshInput.focus();
        }

        const chipsContainer = document.getElementById("quick-chips");
        chipsContainer.innerHTML = "";
        if (q.chips) {
          q.chips.forEach((chipText) => {
            const btn = document.createElement("button");
            btn.className = "chip-btn";
            btn.textContent = chipText;
            btn.onclick = () => {
              const inp = document.getElementById("user-input");
              if (inp) {
                inp.value = chipText;
                inp.focus();
              }
            };
            chipsContainer.appendChild(btn);
          });
        }

        document.getElementById("help-bubble").style.display = "none";
        robot.className = "robot-3d";

        const progress = (currentIndex / activeQuestions.length) * 100;
        document.getElementById("progress-bar").style.width = `${progress}%`;
      }

      function toggleHelp() {
        const q = activeQuestions[currentIndex];
        const bubble = document.getElementById("help-bubble");

        document.getElementById("help-explanation").textContent = q.hint;
        document.getElementById("help-example").textContent = q.example;
        document.getElementById("letters-left").textContent =
          `${q.answer.length} letras`;

        bubble.style.display = "block";
        robot.className = "robot-3d thinking";
        robotSpeak(q.hint, "es-ES", 1.0);
      }

      function repeatHintVoice() {
        const q = activeQuestions[currentIndex];
        robotSpeak(q.hint + ". " + q.example, "es-ES", 1.0);
      }

      function revealNextLetter() {
        const targetWord = activeQuestions[currentIndex].answer;
        if (revealedLetters < targetWord.length) {
          revealedLetters++;
          const partial = targetWord.substring(0, revealedLetters);
          const inp = document.getElementById("user-input");
          if (inp) {
            inp.value = partial;
            inp.focus();
          }
          robotSpeak(`Pista: ${partial}`, "es-ES", 0.95);
        }
      }

      function skipQuestion() {
        currentIndex = (currentIndex + 1) % activeQuestions.length;
        loadQuestion();
      }

      function checkAnswer() {
        const inputField = document.getElementById("user-input");
        if (!inputField) return;
        const userText = inputField.value.trim().toLowerCase();
        const correctText = activeQuestions[currentIndex].answer.toLowerCase();
        const feedback = document.getElementById("feedback");

        if (!userText) return;

        if (userText === correctText) {
          score += 10;
          document.getElementById("score").textContent = score;
          feedback.style.color = "#4ade80";
          feedback.textContent = "🎉 ¡Genial! ¡Respuesta correcta!";
          robot.className = "robot-3d happy";

          robotSpeak(correctText, "en-GB", 1.0);

          setTimeout(() => {
            currentIndex++;
            loadQuestion();
          }, 1500);
        } else {
          feedback.style.color = "#f87171";
          feedback.textContent =
            "❌ ¡Casi! Revisa las letras o pulsa el botón amarillo de Pista 💡";
          robot.className = "robot-3d oops";
          robotSpeak(
            "¡Casi! Pídeme una pista en el botón amarillo si lo necesitas.",
            "es-ES",
            1.05,
          );
        }
      }

      function showVictory() {
        document.getElementById("progress-bar").style.width = "100%";
        document.getElementById("help-bubble").style.display = "none";
        robot.className = "robot-3d happy";

        document.getElementById("quiz-box").innerHTML = `
                <div class="emoji-visual">🏆🎉</div>
                <h2 class="question-text">¡Módulo Completado!</h2>
                <p style="margin-bottom: 20px; font-size: 1.1rem;">Has conseguido <strong>${score} puntos</strong> en esta sección. ¡Selecciona otro tema arriba arriba para continuar!</p>
                <button class="mod-btn active" style="font-size: 1rem; padding: 10px 20px;" onclick="filterCategory(currentModuleKey, document.querySelector('.mod-btn.active'))">🔄 Repetir este módulo</button>
            `;
        robotSpeak(
          "¡Felicidades! Has completado todas las preguntas de este tema. Elige otro arriba cuando quieras.",
          "es-ES",
          1.0,
        );
      }

      loadQuestion();
    </script>
